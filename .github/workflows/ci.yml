# Portable CI gate. Swap for a self-hosted Anvil runner if preferred —
# the gates are the point: gofmt, build, the arch-test (dependency rule),
# race tests, and lint (depguard is the fast gate for the same boundary).
# gofmt and arch go through `make` so CI and `make ci` cannot drift apart.
name: ci
on: [push, pull_request]
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make fmt-check
      - run: go build ./...
      # -count=1 inside the target: the arch-test's verdict comes from `go list`,
      # external state the build cache can't see, so a cached pass can mask a
      # fresh violation.
      - run: make arch
      - run: go test -race ./...
      # action v6 installs the golangci-lint v1 line, which cannot read a
      # `version: "2"` config and is built against an older Go than go.mod
      # targets. v7+ is the v2-capable line. The linter version is pinned
      # rather than `latest` so CI and `make lint` agree on findings.
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.5.0 }
