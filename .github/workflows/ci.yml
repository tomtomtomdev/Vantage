# Portable CI gate. Swap for a self-hosted Anvil runner if preferred —
# the gates (build, race tests, lint incl. depguard boundary) are the point.
name: ci
on: [push, pull_request]
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with: { version: latest }
